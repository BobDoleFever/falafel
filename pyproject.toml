[project]
name = "falafel-cli"
version = "0.1.0"
description = "Standalone, Steam-independent Battle.net launcher for Linux built on umu-launcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5",
]

[project.scripts]
falafel = "falafel.cli:main"

[project.gui-scripts]
falafel-gui = "falafel.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["falafel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
